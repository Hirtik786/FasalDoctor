<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="55%" stop-color="#F4FBF2"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <radialGradient id="sun" cx="78%" cy="22%" r="28%">
      <stop offset="0%" stop-color="#FEF9C3" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#FDE047" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FDE047" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridge1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#166534" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14532D" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3F6212"/>
      <stop offset="30%" stop-color="#365314"/>
      <stop offset="100%" stop-color="#1A2E05"/>
    </linearGradient>
    <linearGradient id="furrow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <radialGradient id="melon" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ECFCCB"/>
      <stop offset="45%" stop-color="#A3E635"/>
      <stop offset="85%" stop-color="#65A30D"/>
      <stop offset="100%" stop-color="#3F6212"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#sky)"/>
  <rect width="1200" height="760" fill="url(#sun)"/>

  <!-- Distant tree line / shelterbelt -->
  <path d="M0 320 Q180 285 360 310 T760 295 T1200 315 L1200 410 L0 410 Z" fill="url(#ridge1)"/>
  <path d="M0 345 Q240 325 490 342 T960 330 T1200 348 L1200 420 L0 420 Z" fill="#166534" opacity="0.25"/>

  <!-- Cultivated melon field -->
  <path d="M0 380 L1200 380 L1200 760 L0 760 Z" fill="url(#field)"/>

  <!-- Perspective crop rows -->
  <g opacity="0.9">
    <polygon points="480,380 560,380 180,760 -40,760" fill="#15803D"/>
    <polygon points="620,380 695,380 590,760 370,760" fill="#166534"/>
    <polygon points="750,380 830,380 1010,760 760,760" fill="#15803D"/>
    <polygon points="880,380 960,380 1240,760 1120,760" fill="#14532D"/>
  </g>

  <!-- Lush Melon Foliage Clusters -->
  <g fill="#22C55E" opacity="0.88">
    <ellipse cx="180" cy="610" rx="135" ry="52" fill="#166534"/>
    <ellipse cx="240" cy="590" rx="105" ry="42" fill="#15803D"/>
    <ellipse cx="515" cy="585" rx="125" ry="48" fill="#166534"/>
    <ellipse cx="565" cy="565" rx="95" ry="38" fill="#22C55E" opacity="0.55"/>
    <ellipse cx="890" cy="615" rx="150" ry="56" fill="#166534"/>
    <ellipse cx="850" cy="592" rx="115" ry="44" fill="#15803D"/>
    <ellipse cx="370" cy="480" rx="90" ry="30" fill="#15803D"/>
    <ellipse cx="670" cy="470" rx="85" ry="28" fill="#166534"/>
    <ellipse cx="820" cy="485" rx="95" ry="30" fill="#15803D"/>
  </g>

  <!-- Foreground Broad Melon Leaves -->
  <g transform="translate(150,550)">
    <path d="M80 90 C25 75, 5 35, 35 12 C58 -5, 92 10, 108 32 C128 8, 165 0, 185 25 C205 50, 180 95, 130 102 C110 106, 95 98, 80 90 Z" fill="#15803D" stroke="#84CC16" stroke-width="1.5" stroke-opacity="0.4"/>
    <path d="M82 90 L108 36 M95 72 L52 38 M100 68 L155 42" stroke="#86EFAC" stroke-width="2" stroke-opacity="0.45" fill="none"/>
  </g>

  <g transform="translate(760,545) scale(1.15)">
    <path d="M80 90 C25 75, 5 35, 35 12 C58 -5, 92 10, 108 32 C128 8, 165 0, 185 25 C205 50, 180 95, 130 102 C110 106, 95 98, 80 90 Z" fill="#166534" stroke="#84CC16" stroke-width="1.5" stroke-opacity="0.45"/>
    <path d="M82 90 L108 36 M95 72 L52 38 M100 68 L155 42" stroke="#86EFAC" stroke-width="2" stroke-opacity="0.45" fill="none"/>
  </g>

  <!-- Ripening Cantaloupe / Muskmelons with netting lines -->
  <g transform="translate(465,610)">
    <ellipse cx="55" cy="50" rx="52" ry="44" fill="url(#melon)"/>
    <path d="M55 6 C35 25, 35 75, 55 94 M55 6 C75 25, 75 75, 55 94 M20 26 C35 45, 35 65, 22 76 M90 26 C75 45, 75 65, 88 76" stroke="#4D7C0F" stroke-width="1.8" opacity="0.55" fill="none"/>
    <path d="M52 8 Q56 -10 72 -8" stroke="#3F6212" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>

  <g transform="translate(650,640) scale(0.86)">
    <ellipse cx="55" cy="50" rx="52" ry="44" fill="url(#melon)"/>
    <path d="M55 6 C35 25, 35 75, 55 94 M55 6 C75 25, 75 75, 55 94" stroke="#4D7C0F" stroke-width="1.8" opacity="0.55" fill="none"/>
    <path d="M52 8 Q45 -8 30 -6" stroke="#3F6212" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>

  <g transform="translate(275,655) scale(0.75)">
    <ellipse cx="55" cy="50" rx="52" ry="44" fill="url(#melon)"/>
    <path d="M55 6 C35 25, 35 75, 55 94 M55 6 C75 25, 75 75, 55 94" stroke="#4D7C0F" stroke-width="1.8" opacity="0.55" fill="none"/>
  </g>
</svg>
